<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  body{
    font-family: Arial, Helvetica, sans-serif;
    background-color: #d9dfe2;
  }
  .container{
    width: 350px;
    margin: 50px auto;
    background: white;
    padding: 100px;
    border-radius: 10px;
  }
  h1{
    text-align: center;
  }
    input,select, textarea{
    width: 100%;
    padding: 8px 0;
    margin: 8px ;
   }
   .gender-group{
  display: flex;
  align-items: center;
  gap: 15px;
   }
   button{
    width: 100%;
    padding: 10px;
    background-color: #0077b5;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 50px;
   }
   button:hover{
    background:#005582
   }

</style>
<body>
  <div class="container">
    <h1>Student Registration Form </h1>
    <form>
      <label for="username">Full name:</label>
      <input type="text" id="username" placeholder="Enter your name">
     <div>
      <label for="email">Enter your email:</label>
      <input type="email" id="email" name="email" placeholder="Enter your email">
     </div>
     <div>
      <label for="phone">Phone No:</label>
      <input type="tel" id="phone" name="phone" placeholder="Enter your phoneno">
     </div>
  <div class="gender-group">
  <label>Gender:</label><br>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
  </label>
</div>
     <div>
       <label>Course</label>
       <select name="Course">
         <option value="BE Computer">BE Computer </option>
         <option value="BE Civil">BE Civil</option>
         <option value="BE Electrical">BE Electrical</option>
         <option value="mechanical">BE Mechanical</option>
        </select>
      </div>
      <div>
        <label>About You</label>
        <textarea name="comment" id="comment" rows="5" cols="50"></textarea>
      </div>
      <button>submit</button>
    </form>
  </div>
</body>
</html>
